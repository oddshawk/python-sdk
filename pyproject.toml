[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oddshawk-sdk"
version = "0.1.0"
description = "Python SDK for the OddsHawk public odds catalog API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "OddsHawk" }]
keywords = ["oddshawk", "odds", "betting", "api", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://odds.software"
Documentation = "https://odds.software/docs/"
API = "https://www.odds.software"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
